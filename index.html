<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — LA KALETA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align:center; margin-bottom: 1.5rem;">
                <div class="logo" style="justify-content:center; font-size: 1.8rem;">LA KALETA</div>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">Streetwear & Urban Culture</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Ingresar</button>
                <button class="auth-tab" onclick="switchTab('register')">Registrarse</button>
            </div>

            <!-- FORMULARIO LOGIN -->
            <form id="form-login" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="tu@correo.com" value="cliente@lakaleta.com">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••" value="123456">
                </div>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
                <div style="text-align:center; margin-top:1rem; font-size:0.8rem; color: var(--text-muted);">
                    <p><strong>Demo Cliente:</strong> cliente@lakaleta.com / 123456</p>
                    <p><strong>Demo Admin:</strong> admin@lakaleta.com / admin123</p>
                </div>
            </form>

            <!-- FORMULARIO REGISTRO -->
            <form id="form-register" onsubmit="handleRegister(event)" style="display:none;">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="reg-nombre" required placeholder="Juan">
                    </div>
                    <div class="form-group">
                        <label>Apellido</label>
                        <input type="text" id="reg-apellido" required placeholder="Pérez">
                    </div>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="reg-email" required placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" id="reg-telefono" required placeholder="999888777">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="reg-password" required placeholder="Mínimo 6 caracteres" minlength="6">
                </div>
                <button type="submit" class="btn-primary">Crear Cuenta</button>
            </form>
        </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            
            const user = DB.getUsers().find(u => u.email === email && u.password === password);
            
            if (user) {
                DB.setCurrentUser(user.id);
                showToast(`¡Bienvenido, ${user.nombre}!`, 'success');
                setTimeout(() => {
                    window.location.href = user.role === 'admin' ? 'admin.html' : 'catalog.html';
                }, 800);
            } else {
                showToast('Credenciales incorrectas', 'error');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const users = DB.getUsers();
            const email = document.getElementById('reg-email').value.trim();
            
            if (users.find(u => u.email === email)) {
                showToast('Este correo ya está registrado', 'error');
                return;
            }

            const newUser = {
                id: DB.generateId(),
                nombre: document.getElementById('reg-nombre').value + ' ' + document.getElementById('reg-apellido').value,
                email: email,
                telefono: document.getElementById('reg-telefono').value,
                password: document.getElementById('reg-password').value,
                role: 'client',
                direccion: ''
            };

            users.push(newUser);
            DB.setUsers(users);
            DB.setCurrentUser(newUser.id);
            showToast('¡Cuenta creada exitosamente!', 'success');
            setTimeout(() => window.location.href = 'catalog.html', 800);
        }

        // Si ya hay sesión, redirigir
        document.addEventListener('DOMContentLoaded', () => {
            const user = DB.getCurrentUser();
            if (user) {
                window.location.href = user.role === 'admin' ? 'admin.html' : 'catalog.html';
            }
        });
    </script>
</body>
</html>
