<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto — LA KALETA</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .variant-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
        }
        .variant-section h4 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .variant-section h4 .stock-total {
            color: var(--primary);
            font-weight: 800;
        }
        .variant-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .variant-btn {
            background: var(--bg);
            border: 2px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.2s;
            position: relative;
            min-width: 50px;
            text-align: center;
        }
        .variant-btn:hover:not(.disabled):not(.selected) {
            border-color: var(--primary);
        }
        .variant-btn.selected {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 0 15px rgba(255, 61, 0, 0.4);
        }
        .variant-btn.disabled {
            opacity: 0.35;
            cursor: not-allowed;
            text-decoration: line-through;
            background: #1a1a1a;
            color: #555;
        }
        .variant-btn .stock-mini {
            display: block;
            font-size: 0.65rem;
            font-weight: 500;
            opacity: 0.8;
            margin-top: 2px;
        }
        .variant-btn.selected .stock-mini {
            color: #ffe0d5;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }
        .info-item {
            background: var(--surface);
            padding: 1rem;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
        }
        .info-item .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
            font-weight: 700;
        }
        .info-item .value {
            font-size: 0.9rem;
            line-height: 1.5;
        }
        @media (min-width: 768px) {
            .info-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        .live-stock-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.3);
            color: var(--success);
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .live-stock-indicator::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse-live 1.5s infinite;
        }
        @keyframes pulse-live {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .error-box {
            background: rgba(255, 23, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            margin: 2rem 0;
        }

        /* ============ BOTÓN SOLICITAR VENDEDOR ============ */
        .btn-seller {
            background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s;
            margin-top: 0.8rem;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.3);
            position: relative;
            overflow: hidden;
        }
        .btn-seller:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(25, 118, 210, 0.5);
            background: linear-gradient(135deg, #2196f3 0%, #1565c0 100%);
        }
        .btn-seller:active {
            transform: translateY(0);
        }
        .btn-seller:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #333;
            box-shadow: none;
        }
        .btn-seller .icon {
            font-size: 1.3rem;
        }
        .btn-seller::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .btn-seller:hover::before {
            left: 100%;
        }

        /* ============ MODAL DE SOLICITUD ============ */
        .seller-modal-info {
            background: var(--bg);
            border-radius: 12px;
            padding: 1.2rem;
            margin: 1rem 0;
            text-align: left;
            border-left: 4px solid #1976d2;
        }
        .seller-modal-info .row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .seller-modal-info .row:last-child {
            border-bottom: none;
        }
        .seller-modal-info .row .label {
            color: var(--text-muted);
        }
        .seller-modal-info .row .value {
            font-weight: 700;
            color: var(--text);
        }
        .seller-modal-info .row .value.highlight {
            color: var(--primary);
        }

        .seller-ticket {
            background: linear-gradient(135deg, #0d47a1 0%, #1976d2 100%);
            color: white;
            padding: 1rem;
            border-radius: 12px;
            margin: 1rem 0;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .seller-ticket::before,
        .seller-ticket::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: var(--surface);
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
        }
        .seller-ticket::before { left: -10px; }
        .seller-ticket::after { right: -10px; }

        .seller-ticket .code {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin: 0.5rem 0;
            font-family: 'Courier New', monospace;
        }
        .seller-ticket .label {
            font-size: 0.75rem;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .seller-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .seller-actions button {
            flex: 1;
            min-width: 120px;
        }

        /* Animación de pulso del botón cuando no hay vendedor */
        @keyframes pulse-seller {
            0%, 100% { box-shadow: 0 4px 15px rgba(25, 118, 210, 0.3); }
            50% { box-shadow: 0 4px 25px rgba(25, 118, 210, 0.6); }
        }
        .btn-seller.pulse {
            animation: pulse-seller 2s infinite;
        }
    </style>
</head>
<body>

    <header></header>

    <div class="container">
        <div class="breadcrumb">
            <a href="catalog.html">Catálogo</a> / <span id="breadcrumb-cat">Producto</span>
        </div>

        <div class="product-detail" id="product-detail"></div>

        <div style="margin-top: 3rem;">
            <h2 style="margin-bottom: 1.5rem; text-transform:uppercase; letter-spacing:1px;">Productos Relacionados</h2>
            <div class="grid-products" id="related-products"></div>
        </div>
    </div>

    <!-- ============ MODAL SOLICITAR VENDEDOR ============ -->
    <div class="modal" id="seller-modal">
        <div class="modal-content">
            <h3>🛎️ Solicitar Vendedor</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">
                Un vendedor traerá esta prenda directo a tu probador
            </p>

            <div class="seller-modal-info" id="seller-modal-info">
                <!-- Se llena vía JS -->
            </div>

            <div id="seller-ticket-container"></div>

            <div class="seller-actions" id="seller-actions">
                <button class="btn-secondary" onclick="closeSellerModal()">Cancelar</button>
                <button class="btn-primary" onclick="confirmarSolicitudVendedor()" style="background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%);">
                    ✅ Confirmar Solicitud
                </button>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 LA KALETA — Streetwear & Urban Culture</p>
    </footer>

    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
    <script>
        let currentProduct = null;
        let selectedTalla = null;
        let selectedColor = null;
        let solicitudActiva = null;

        function getFallback(nombre) {
            return `https://placehold.co/600x600/1e1e1e/ff3d00?text=${encodeURIComponent(nombre)}&font=Montserrat`;
        }

        function stockClass(n) {
            if (n === 0) return 'stock-out';
            if (n <= 3) return 'stock-low';
            return 'stock-ok';
        }

        function stockLabel(n) {
            if (n === 0) return 'Agotado';
            if (n <= 3) return `Solo ${n}`;
            return `${n} disp.`;
        }

        function loadProduct() {
            console.log('🚀 Cargando producto...');
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                window.location.href = 'catalog.html';
                return;
            }

            const product = DB.getProducts().find(p => p.id == id);

            if (!product) {
                document.getElementById('product-detail').innerHTML = `
                    <div class="error-box">
                        <h3>Producto no encontrado</h3>
                        <a href="catalog.html" class="btn-primary" style="margin-top: 1rem; max-width: 250px;">Volver al catálogo</a>
                    </div>
                `;
                return;
            }

            currentProduct = product;

            if (!product.tallas || !product.colores || !product.inventario) {
                document.getElementById('product-detail').innerHTML = `
                    <div class="error-box">
                        <h3>Producto con datos incompletos</h3>
                        <button class="btn-primary" onclick="forzarReseed()" style="margin-top: 1rem;">Limpiar y Recargar</button>
                    </div>
                `;
                return;
            }

            // Auto-seleccionar primera variante con stock
            selectedTalla = null;
            selectedColor = null;
            for (const t of product.tallas) {
                for (const c of product.colores) {
                    if (DB.getStockByVariant(product, t, c) > 0) {
                        selectedTalla = t;
                        selectedColor = c;
                        break;
                    }
                }
                if (selectedTalla) break;
            }
            if (!selectedTalla) {
                selectedTalla = product.tallas[0];
                selectedColor = product.colores[0];
            }

            document.getElementById('breadcrumb-cat').innerText = product.categoria;

            const hasDiscount = product.precioAnterior && product.precioAnterior > product.precio;
            const discountPct = hasDiscount ? Math.round((1 - product.precio / product.precioAnterior) * 100) : 0;
            const totalStock = product.stock;
            const fallbackUrl = product.fallback || getFallback(product.nombre);

            let estadoStock, estadoClass;
            if (totalStock === 0) { estadoStock = '❌ Producto Agotado'; estadoClass = 'out'; }
            else if (totalStock <= 10) { estadoStock = `⚠️ Últimas unidades (${totalStock} disponibles)`; estadoClass = 'low'; }
            else { estadoStock = `✅ Disponible (${totalStock} unidades)`; estadoClass = ''; }

            document.getElementById('product-detail').innerHTML = `
                <div class="product-gallery">
                    <img src="${product.img}" 
                         alt="${product.nombre}" 
                         onerror="this.onerror=null; this.src='${fallbackUrl}';">
                </div>
                <div class="product-detail-info">
                    <div class="category" style="color: var(--text-muted); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 0.5rem;">${product.categoria}</div>
                    <h1>${product.nombre}</h1>
                    
                    <div class="price-block">
                        <span class="price">S/ ${product.precio.toFixed(2)}</span>
                        ${hasDiscount ? `<span class="price-old">S/ ${product.precioAnterior.toFixed(2)}</span><span class="discount-tag">-${discountPct}%</span>` : ''}
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <span class="live-stock-indicator">● Stock en tiempo real</span>
                    </div>

                    <div class="stock-info">
                        <span class="stock-dot ${estadoClass}"></span>
                        <span style="color: var(--text-muted); font-weight: 600;">${estadoStock}</span>
                    </div>

                    <p class="description">${product.descLarga || product.desc}</p>

                    <div class="variant-section">
                        <h4>
                            <span>📏 Talla</span>
                            <span class="stock-total">${product.tallas.length} opciones</span>
                        </h4>
                        <div class="variant-options" id="talla-options">
                            ${product.tallas.map(t => {
                                const stockT = DB.getStockByTalla(product, t);
                                const disabled = stockT === 0 ? 'disabled' : '';
                                return `
                                    <button class="variant-btn ${disabled}" 
                                            data-talla="${t}" 
                                            onclick="selectTalla('${t}', this)">
                                        ${t}
                                        <span class="stock-mini">${stockLabel(stockT)}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="variant-section">
                        <h4>
                            <span>🎨 Color</span>
                            <span class="stock-total">${product.colores.length} opciones</span>
                        </h4>
                        <div class="variant-options" id="color-options">
                            ${product.colores.map(c => {
                                const stockC = DB.getStockByColor(product, c);
                                const disabled = stockC === 0 ? 'disabled' : '';
                                return `
                                    <button class="variant-btn ${disabled}" 
                                            data-color="${c}" 
                                            onclick="selectColor('${c}', this)">
                                        ${c}
                                        <span class="stock-mini">${stockLabel(stockC)}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="variant-section">
                        <h4>
                            <span>📊 Disponibilidad por combinación</span>
                        </h4>
                        <div id="combinacion-info"></div>
                    </div>

                    <div id="add-to-cart-container" style="margin-top: 1.5rem;"></div>

                    <!-- ============ BOTÓN SOLICITAR VENDEDOR ============ -->
                    <button class="btn-seller pulse" id="btn-solicitar-vendedor" onclick="abrirModalVendedor()">
                        <span class="icon">🛎️</span>
                        <span>Solicitar que un vendedor me traiga esta talla al probador</span>
                    </button>

                    <div class="info-grid">
                        <div class="info-item">
                            <div class="label">🧵 Composición</div>
                            <div class="value">${product.composicion || 'No especificada'}</div>
                        </div>
                        <div class="info-item">
                            <div class="label">🌍 Origen</div>
                            <div class="value">${product.origen || 'No especificado'}</div>
                        </div>
                        <div class="info-item">
                            <div class="label">🧼 Cuidados</div>
                            <div class="value">${product.cuidados || 'Lavar según indicaciones de la etiqueta'}</div>
                        </div>
                        <div class="info-item">
                            <div class="label">🛡️ Garantía</div>
                            <div class="value">${product.garantia || '30 días'}</div>
                        </div>
                        <div class="info-item">
                            <div class="label">📦 SKU</div>
                            <div class="value">${product.sku}</div>
                        </div>
                        <div class="info-item">
                            <div class="label">🚚 Envío</div>
                            <div class="value">Gratis en compras mayores a S/ 150</div>
                        </div>
                    </div>
                </div>
            `;

            actualizarSeleccionUI();
            renderCombinacionInfo();
            renderBotonAgregar();

            const related = DB.getProducts().filter(p => p.categoriaId === product.categoriaId && p.id !== product.id).slice(0, 4);
            const relatedGrid = document.getElementById('related-products');
            
            if (related.length === 0) {
                relatedGrid.innerHTML = '<p style="color: var(--text-muted);">No hay productos relacionados.</p>';
                return;
            }

            relatedGrid.innerHTML = related.map(p => {
                const fallback = p.fallback || getFallback(p.nombre);
                return `
                    <div class="product-card">
                        <a href="product.html?id=${p.id}" style="text-decoration:none; color:inherit;">
                            <img src="${p.img}" 
                                 alt="${p.nombre}" 
                                 loading="lazy" 
                                 onerror="this.onerror=null; this.src='${fallback}';">
                            <div class="product-info">
                                <h3>${p.nombre}</h3>
                                <div class="product-price">S/ ${p.precio.toFixed(2)}</div>
                                <div style="font-size: 0.75rem; color: var(--text-muted);">
                                    ${p.stock > 0 ? `✅ ${p.stock} en stock` : '❌ Agotado'}
                                </div>
                            </div>
                        </a>
                    </div>
                `;
            }).join('');
        }

        function forzarReseed() {
            localStorage.clear();
            window.location.reload();
        }

        // ---------- SELECCIÓN ----------
        function selectTalla(talla, btn) {
            if (btn.classList.contains('disabled')) return;
            selectedTalla = talla;
            actualizarSeleccionUI();
            renderCombinacionInfo();
            renderBotonAgregar();
        }

        function selectColor(color, btn) {
            if (btn.classList.contains('disabled')) return;
            selectedColor = color;
            actualizarSeleccionUI();
            renderCombinacionInfo();
            renderBotonAgregar();
        }

        function actualizarSeleccionUI() {
            document.querySelectorAll('#talla-options .variant-btn').forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.talla === selectedTalla);
            });
            document.querySelectorAll('#color-options .variant-btn').forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.color === selectedColor);
            });

            const p = currentProduct;
            document.querySelectorAll('#talla-options .variant-btn').forEach(btn => {
                const t = btn.dataset.talla;
                const stockCombo = DB.getStockByVariant(p, t, selectedColor);
                btn.classList.toggle('disabled', stockCombo === 0);
            });
            document.querySelectorAll('#color-options .variant-btn').forEach(btn => {
                const c = btn.dataset.color;
                const stockCombo = DB.getStockByVariant(p, selectedTalla, c);
                btn.classList.toggle('disabled', stockCombo === 0);
            });
        }

        function renderCombinacionInfo() {
            const p = currentProduct;
            const container = document.getElementById('combinacion-info');
            if (!container) return;

            const stock = DB.getStockByVariant(p, selectedTalla, selectedColor);
            const estado = stock === 0 ? '❌ Agotado' : (stock <= 3 ? '⚠️ Últimas unidades' : '✅ Disponible');
            const color = stock === 0 ? 'var(--danger)' : (stock <= 3 ? 'var(--warning)' : 'var(--success)');

            container.innerHTML = `
                <div style="background: var(--bg); padding: 1rem; border-radius: 8px; border-left: 3px solid ${color};">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
                        <div>
                            <div style="font-size: 0.8rem; color: var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom: 4px;">Tu selección</div>
                            <div style="font-size: 1.05rem; font-weight: 700;">
                                Talla <span style="color: var(--primary);">${selectedTalla}</span> · Color <span style="color: var(--primary);">${selectedColor}</span>
                            </div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 0.75rem; color: var(--text-muted); text-transform:uppercase; margin-bottom: 2px;">Disponibles</div>
                            <div style="font-size: 1.3rem; font-weight: 800; color: ${color};">
                                ${stock} ${stock === 1 ? 'unidad' : 'unidades'}
                            </div>
                        </div>
                    </div>
                    <div style="margin-top: 0.8rem; font-size: 0.85rem; color: ${color}; font-weight: 700;">
                        ${estado}
                    </div>
                </div>
            `;
        }

        function renderBotonAgregar() {
            const p = currentProduct;
            const stock = DB.getStockByVariant(p, selectedTalla, selectedColor);
            const container = document.getElementById('add-to-cart-container');
            if (!container) return;

            if (stock === 0) {
                container.innerHTML = `
                    <button class="btn-primary" disabled style="opacity:0.5; cursor:not-allowed; background:#333;">
                        ❌ Sin stock en esta combinación
                    </button>
                    <p style="text-align:center; font-size:0.85rem; color: var(--text-muted); margin-top:0.8rem;">
                        Prueba con otra talla o color
                    </p>
                `;
                return;
            }

            container.innerHTML = `
                <button class="btn-primary" onclick="addToCart()">
                    🛒 Agregar al Carrito · S/ ${(p.precio).toFixed(2)}
                </button>
            `;
        }

        function addToCart() {
            if (!currentProduct) return;
            const stock = DB.getStockByVariant(currentProduct, selectedTalla, selectedColor);
            if (stock === 0) {
                showToast('Sin stock en esta combinación', 'error');
                return;
            }
            Cart.add(currentProduct, selectedTalla, selectedColor);
            renderHeader();
        }

        // ============================================================
        // SOLICITAR VENDEDOR AL PROBADOR
        // ============================================================
        function abrirModalVendedor() {
            const p = currentProduct;
            const stock = DB.getStockByVariant(p, selectedTalla, selectedColor);

            if (stock === 0) {
                showToast('Esta combinación no tiene stock', 'error');
                return;
            }

            // Generar código único de solicitud
            const codigo = generarCodigoSolicitud();
            solicitudActiva = {
                codigo,
                producto: p.nombre,
                sku: p.sku,
                talla: selectedTalla,
                color: selectedColor,
                precio: p.precio,
                fecha: new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' })
            };

            // Llenar info del modal
            document.getElementById('seller-modal-info').innerHTML = `
                <div class="row">
                    <span class="label">Producto:</span>
                    <span class="value">${p.nombre}</span>
                </div>
                <div class="row">
                    <span class="label">SKU:</span>
                    <span class="value">${p.sku}</span>
                </div>
                <div class="row">
                    <span class="label">Talla solicitada:</span>
                    <span class="value highlight">${selectedTalla}</span>
                </div>
                <div class="row">
                    <span class="label">Color:</span>
                    <span class="value highlight">${selectedColor}</span>
                </div>
                <div class="row">
                    <span class="label">Precio:</span>
                    <span class="value">S/ ${p.precio.toFixed(2)}</span>
                </div>
            `;

            // Ocultar el ticket (se muestra al confirmar)
            document.getElementById('seller-ticket-container').innerHTML = '';

            // Restaurar botones
            document.getElementById('seller-actions').innerHTML = `
                <button class="btn-secondary" onclick="closeSellerModal()">Cancelar</button>
                <button class="btn-primary" onclick="confirmarSolicitudVendedor()" style="background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%);">
                    ✅ Confirmar Solicitud
                </button>
            `;

            // Abrir modal
            document.getElementById('seller-modal').classList.add('active');
        }

        function confirmarSolicitudVendedor() {
            if (!solicitudActiva) return;

            const s = solicitudActiva;

            // Guardar la solicitud en localStorage (para el panel admin)
            const solicitudes = JSON.parse(localStorage.getItem('lk_solicitudes_vendedor') || '[]');
            solicitudes.push({
                ...s,
                estado: 'pendiente',
                timestamp: Date.now()
            });
            localStorage.setItem('lk_solicitudes_vendedor', JSON.stringify(solicitudes));

            // Mostrar ticket de confirmación
            document.getElementById('seller-ticket-container').innerHTML = `
                <div class="seller-ticket">
                    <div class="label">Código de atención</div>
                    <div class="code">${s.codigo}</div>
                    <div class="label">Solicitud registrada</div>
                </div>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 1rem; line-height: 1.5;">
                    🛎️ Un vendedor ha sido notificado. En breve llegará a tu probador con:<br>
                    <strong style="color: var(--primary);">${s.talla}</strong> · <strong style="color: var(--primary);">${s.color}</strong>
                </p>
                <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.8rem;">
                    ⏱️ Hora: ${s.fecha}
                </p>
            `;

            // Cambiar botones
            document.getElementById('seller-actions').innerHTML = `
                <button class="btn-primary" onclick="closeSellerModal()" style="background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%);">
                    ✅ Entendido
                </button>
            `;

            // Toast de confirmación
            showToast(`🛎️ Solicitud enviada. Código: ${s.codigo}`, 'success');
        }

        function generarCodigoSolicitud() {
            // Generar código tipo: LK-1234
            const num = Math.floor(1000 + Math.random() * 9000);
            return `LK-${num}`;
        }

        function closeSellerModal() {
            document.getElementById('seller-modal').classList.remove('active');
            solicitudActiva = null;
        }

        document.addEventListener('DOMContentLoaded', () => {
            requireAuth('client');
            loadProduct();
        });
    </script>
</body>
</html>
